<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Python Basics — Learn Python the Practical Way</title>
    <meta name="description" content="Learn Python step by step through simple explanations and practical coding." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before React mounts so there's no flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem("theme");
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored === "dark" || (stored !== "light" && systemDark);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
  </head>
  <body class="bg-paper dark:bg-ink font-body text-slate-800 dark:text-slate-100 transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
